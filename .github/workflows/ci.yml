# Builds, unit-tests, and runs the live ROS2 e2e suite for the recorder
# (clipper) against every working ROS2 distro on each push. A separate `fmt`
# job checks workspace formatting (rustfmt) in parallel.
#
# Each distro is one matrix leg. A leg enters that distro's nix dev shell
# (`nix develop .#<distro>`) — which supplies the ROS2 closure, r2r codegen
# env, and C toolchain — and runs the system cargo inside it, exactly as a
# developer does locally. The ROS2 closure is substituted from the self-hosted
# attic binary cache (cache.stfl.dev/momentedge, backed by Cloudflare R2) and
# pushed back at the end of each run so later legs substitute the closure
# instead of realising it from source. Cargo artifacts are cached per distro
# via Swatinem/rust-cache, which is orthogonal and remains.
#
# Scope: the recorder's device build (`--features clipper/ros`) on every distro,
# plus two lean ROS-free lanes on a plain toolchain — the `clip` and `tail`
# libraries together with the recorder's own default (ROS-free) build, and the
# `cu-mcap-record` copper example (trigger-pub is not in CI).
# Distros: humble, jazzy, lyrical — the three the Rust crates build under
# (rolling cannot build r2r 0.9.6; see the `build` skill, "r2r / IDL build model
# and distro support"). The e2e step below runs the full suite on every leg under
# the `e2e` nextest profile — the whole binary, nothing filtered out and nothing
# skipped from inside a test; the matrix comment says what each distro costs.

name: CI

# Every commit runs the matrix once: `push` fires on all branches, so each commit
# is tested. pull_request is intentionally omitted — it would re-run the whole
# matrix a second time for same-repo PR branches (a different concurrency group),
# doubling this heavy ROS2-from-source CI. Same-repo PRs still surface the push
# run's checks; add `pull_request:` if fork contributions ever need their own CI.
on:
  push:
  workflow_dispatch:

# One in-flight run per ref; a new push cancels the superseded run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Workspace formatting gate. rustfmt only parses source, so this needs neither
  # the nix dev shell nor the ROS2 closure that the recorder matrix below sets up
  # — just a toolchain's rustfmt component. It must be a *nightly* one: rustfmt.toml
  # carries unstable options (group_imports, imports_granularity) that only nightly
  # rustfmt honours, and the dev box's system rustfmt is nightly too, so a stable
  # rustfmt here would both reject the config and disagree with locally-formatted
  # code. `components: rustfmt` keeps the install to rustfmt only — no full nightly
  # std/clippy. One cheap job checks both crates (`--all`), runs in parallel with
  # the recorder matrix, and is distro-independent.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  # Lean ROS-free lane for the copper example: a fast signal that the
  # cu-mcap-record member builds, clippies, and tests without the ROS toolchain.
  # It is a workspace member, but its cu29 deps are crate-local (not in
  # [workspace.dependencies]), so nothing in the ROS lanes compiles cu29 unless
  # it asks for `-p cu-mcap-record` — which the recorder matrix does, once, to
  # prebuild the live-e2e Producer fixture. This job runs from the repo root with
  # `-p cu-mcap-record` on the plain system toolchain — no nix, no ROS — so `-p`
  # pulls only the example and its cu29 tree, never clipper's r2r closure.
  # `--locked` enforces the shared root lockfile. Formatting is covered by the
  # `fmt` job's `cargo fmt --all --check`, which now includes this member.
  cu-mcap-record:
    name: cu-mcap-record
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # stable for the edition-2024 build/clippy/test. Latest stable is well
      # past 1.85.
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Guards rust-cache against its own `target/tests` handling, which would
      # otherwise corrupt the restored target/ and break the build after it.
      #
      # cu29-derive's build script copies its trybuild fixtures into
      # <target>/tests/trybuild, so any target/ that has compiled cu29 carries a
      # `tests` entry. rust-cache special-cases that entry and recurses into both
      # <target>/tests/target and <target>/tests/trybuild — but the first call is
      # not awaited, so when that directory is absent (only trybuild is ever
      # created) the ENOENT rejection escapes its try/catch as an unhandled
      # rejection and kills the action mid-clean. The half-cleaned target/ keeps
      # .fingerprint entries whose build-script binaries were already deleted, and
      # the next cargo build dies on a build script it thinks is up to date:
      # "could not execute process .../build-script-build (never executed)".
      #
      # Creating the directory makes that recursion open an empty dir and return.
      # It runs before rust-cache so the guard is in place for the restore-time
      # clean (which fires on a partial key match), and the directory is then
      # cached too — so a cache already poisoned with a bare tests/trybuild heals
      # on its next run rather than needing a cache-key bump.
      - name: Pre-create target/tests/target for rust-cache
        run: mkdir -p target/tests/target

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cu-mcap-record

      - name: Clippy
        run: cargo clippy --locked --all-targets -p cu-mcap-record

      - name: Test
        run: cargo test --locked -p cu-mcap-record

  # ROS-free lane for the two library crates. The whole reason the MCAP format
  # layer, the recording index, the cut path and the tail live outside the
  # recorder is that a consumer can link them with no ROS installation anywhere —
  # so something has to hold that property down. The recorder itself is here for
  # the same reason: ROS is a cargo feature of `clipper`, off by default, so a
  # default-features recorder links no ROS either and runs its MCAP interface on
  # a host that has never seen a ROS install.
  #
  # This job builds, lints and tests `clip`, `tail` and `clipper` (default
  # features) on a plain stable toolchain — no nix, no ROS2 closure, nothing on
  # PATH but cargo — and asserts up front that none of the three default
  # dependency trees contains r2r. An r2r dependency that escapes `clip`'s or
  # `clipper`'s `ros` feature then turns this job red in seconds, instead of
  # surfacing much later as a missing rmw at link time in a build that has no ROS
  # toolchain at all.
  #
  # It is cheap for the same reasons: small crates on a stock toolchain, with
  # neither a nix realization nor a ROS2 closure to substitute, so it reports long
  # before the recorder matrix finishes. `--locked` enforces the shared root
  # lockfile; formatting is covered by the `fmt` job's `cargo fmt --all --check`.
  # The e2e binary compiles here (it drives the ros2 CLI as a subprocess and links
  # no ROS itself) but every one of its tests short-circuits on the unset
  # CLIPPER_E2E gate; the live suite runs in the recorder matrix below.
  #
  # There is deliberately no `--features ros` build here: that arm needs the ROS
  # toolchain this job is defined by not having. The per-distro `recorder` matrix
  # below covers it — it builds and tests the recorder with the feature on, and
  # its unit step selects `clip` and `tail` alongside it so the resolver unifies
  # `ros` and `clap` onto clip's test target and the feature-gated tests run there.
  libraries:
    name: clip + tail + clipper (ROS-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # stable for the edition-2024 build/clippy/test, as in the job above.
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # The same rust-cache guard the cu-mcap-record job documents at length
      # above: cargo builds into the shared root target/, which carries a `tests`
      # entry once cu29 has been compiled into it.
      - name: Pre-create target/tests/target for rust-cache
        run: mkdir -p target/tests/target

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: libraries

      # The property this lane exists for, checked before anything is compiled:
      # `cargo tree` resolves from the lockfile without building, so a leak fails
      # here rather than deep in a clippy run. The tree is captured first and
      # tested afterwards on purpose — piping cargo into grep would let the good
      # case (grep matches nothing, exits 1) decide the step's status under
      # pipefail, inverting the check.
      - name: Assert the default builds pull no r2r
        run: |
          set -euo pipefail
          for crate in clip tail clipper; do
            tree=$(cargo tree --locked -p "$crate" -e normal --prefix none)
            echo "$tree"
            if grep -q '^r2r' <<<"$tree"; then
              echo "::error::$crate's default dependency tree contains r2r: the crate no longer builds without a ROS installation."
              echo "Every r2r dependency must sit behind an optional 'ros' feature (clip's, or clipper's, which enables clip's), and both are off by default."
              exit 1
            fi
          done

      - name: Clippy
        run: cargo clippy --locked --all-targets -p clip -p tail -p clipper -- -D warnings

      # Building the docs is the only thing that runs rustdoc's lints, and
      # `RUSTDOCFLAGS` is what promotes the `[workspace.lints.rustdoc]` block to
      # a gate. It catches what clippy cannot: an intra-doc link that does not
      # resolves, or one from public documentation into a private item. Same
      # command as `just check`'s last line.
      - name: Docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps -p clip -p tail -p clipper

      - name: Test
        run: cargo test --locked -p clip -p tail -p clipper

  recorder:
    name: ${{ matrix.distro }}
    runs-on: ubuntu-latest
    # Caps a wedged from-source nix build or a stuck `nix develop`; the nextest
    # slow-timeout only bounds individual e2e tests, not Build or nix
    # realization. Generous for the cold-cache run that builds ROS packages
    # ros.cachix.org lacks; warm-cache runs are a few minutes.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy, lyrical]
        include:
          # Per-distro e2e selection (nextest filterset). Every distro runs the
          # whole e2e binary, nothing filtered out and nothing skipped from
          # inside a test. The recovery suite discovers recordings by mtime and
          # asserts on path-free log needles, so lyrical's timestamped rosbag2
          # filenames do not break it (beads clipper-7ys); the live-corruption
          # cases place their damage against the recording's own record framing,
          # so each asks the recorder for one outcome (beads clipper-3q8).
          - distro: humble
            e2e_filter: binary(e2e)
          - distro: jazzy
            e2e_filter: binary(e2e)
          - distro: lyrical
            e2e_filter: binary(e2e)
    steps:
      - uses: actions/checkout@v6

      # Installs Nix from the official releases.nixos.org source (no third-party
      # installer CDN). Flakes are enabled and the ROS2 binary cache
      # (ros.cachix.org) is added as a substituter so the upstream ROS2 packages
      # are substituted rather than compiled; the flake's own nixConfig is honoured
      # via accept-flake-config. The momentedge attic cache is wired up separately
      # by the next step.
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://ros.cachix.org
            extra-trusted-public-keys = ros.cachix.org-1:dSyZxI8geDCJrwgvCOHDoAfOm5sV1wCPjBkKL+38Rvo=
            # Harden cache.nixos.org substitution on loaded runners. The large
            # sim-distro NARs (gtk4, ffmpeg, sdl) drop mid-transfer over HTTP/2
            # ("framing layer" resets); curl's resume then hits a fatal,
            # un-retried 416, defeating the per-file retry. Forcing HTTP/1.1
            # avoids the framing resets, and a couple more attempts cover the rest.
            http2 = false
            download-attempts = 7

      # Installs the attic client, logs in with the ATTIC_TOKEN repo secret, and
      # registers the self-hosted momentedge cache (cache.stfl.dev) as a
      # substituter for this job — the sole source of the project's ROS2 closure,
      # so a run is a true test of whether that closure is cached in attic.
      # skip-push disables the action's built-in diff push; the "Push entire
      # store to attic" step at the end uploads the whole store, which keeps the
      # cache complete even across flake-input changes.
      - name: Set up momentedge attic cache
        uses: ryanccn/attic-action@v0.5
        with:
          endpoint: https://cache.stfl.dev
          cache: momentedge
          token: ${{ secrets.ATTIC_TOKEN }}
          skip-push: true

      # System Rust toolchain, used inside the nix shell — the flake deliberately
      # ships no Rust. The crates build on stable (no feature gates).
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # cargo-nextest: the required runner for the gated e2e suite, and used for
      # the unit run too for consistent output.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # The copper example is a workspace member, so its cu29 tree builds into the
      # same root target/ as everything else — which is also why this leg needs
      # the same rust-cache guard the cu-mcap-record job documents above.
      - name: Pre-create target/tests/target for rust-cache
        run: mkdir -p target/tests/target

      # Caches cargo registry + this distro's target/ (the r2r build links the
      # distro's rcl/rmw, so the key is per distro). The copper example's cu29
      # tree caches with everything else — no separate workspace entry needed.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.distro }}

      # Realise the distro's dev shell on its own, so the ROS2 closure is
      # substituted (from momentedge / ros.cachix.org) as a distinct step. A full
      # cache hit makes this fast; a miss shows up here as a from-source build
      # rather than being hidden inside the cargo step.
      - name: Realise the ROS2 dev shell
        run: nix develop ".#${{ matrix.distro }}" --command true

      # Build the clipper binary, the custom-mcap-writer example producer, and
      # the cu-mcap-record copper example. The copper binary is the live copper
      # e2e's Producer fixture (`copper_sink_recording_produces_clip`);
      # prebuilding it here (its own `-p` target now that it is a member) keeps
      # the cu29 compile out of the test's own timeout — the e2e's on-demand
      # build then finds it up to date. Its cu29 deps are crate-local, so `-p`
      # pulls the cu29 tree only for this one target, not the whole matrix.
      #
      # `--features clipper/ros` is what makes this the device build: ROS is a
      # cargo feature of the recorder, off by default, and this matrix is the
      # lane that has the ROS toolchain to build it with. The package-qualified
      # spelling is required because more than one package is selected.
      - name: Build
        run: nix develop ".#${{ matrix.distro }}" --command cargo build --locked --features clipper/ros -p clipper -p custom-mcap-writer -p cu-mcap-record

      # The libraries are selected alongside the recorder so their feature-gated
      # tests actually run somewhere. `clip`'s `cdr_round_trips_through_r2r` needs
      # the `ros` feature and `display_matches_the_clap_value_names` needs `clap`;
      # the ROS-free `libraries` job builds neither feature by design, so this is
      # the only lane that can. Selecting all three lets the resolver unify the
      # recorder's `clip` features onto clip's own test target — and
      # `clipper/ros` is what turns `clip`'s `ros` on in the first place.
      - name: Unit tests
        run: nix develop ".#${{ matrix.distro }}" --command cargo nextest run --locked --features clipper/ros -p clip -p tail -p clipper -E 'not binary(e2e)'

      # Live ROS2 e2e: real `ros2 bag record`, CLI-published triggers, real
      # Recorded announcements. Gated on CLIPPER_E2E; serialized and
      # timeout-bounded by the `e2e` nextest profile (.config/nextest.toml).
      # CLIPPER_E2E=1 is the whole gate: every test in the binary runs on every
      # leg. `--features ros` builds the binary under test as the device build —
      # the suite drives it on `--trigger-source ros`, which only that build
      # offers.
      - name: E2E tests
        run: |
          nix develop ".#${{ matrix.distro }}" --command \
            env CLIPPER_E2E=1 cargo nextest run --locked -p clipper \
            --features ros --profile e2e -E '${{ matrix.e2e_filter }}'

      # Pushes the entire /nix/store to momentedge so the full ROS2 closure lands
      # in the cache even on a complete GitHub-cache restore when nothing is
      # rebuilt — the migration target is to serve the whole closure from attic
      # alone. atticd skips paths already in its upstream (cache.nixos.org), so
      # only the ROS2 and project-specific paths are actually stored. The attic
      # client and its login come from the setup step above; runs on failure too.
      #
      # The cache fronts atticd with a Cloudflare tunnel whose origin timeout is
      # ~100 s. A large ROS2 debug NAR can take longer than that for the small
      # cache host to receive, compress, and write to R2, which surfaces as an
      # HTTP 524/502; the attic client does not retry 5xx and aborts the whole
      # push on the first one. --jobs 1 serialises uploads so each large path
      # gets the host's full resources and finishes within the timeout, and the
      # retry loop resumes after a transient 5xx — atticd chunk-deduplicates
      # already-stored data, so each attempt uploads less and converges.
      - name: Push entire store to attic
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          paths=$(nix path-info --all | grep -vE '\.(drv|drv\.chroot|check|lock)$')
          for attempt in 1 2 3 4 5; do
            echo "::group::attic push attempt $attempt"
            if printf '%s\n' "$paths" | attic push --jobs 1 --stdin momentedge; then
              echo "::endgroup::"
              echo "push complete on attempt $attempt"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt hit a transient error; retrying in 15 s (atticd dedups already-stored paths)"
            sleep 15
          done
          echo "push did not fully complete after 5 attempts; momentedge is partially populated"
