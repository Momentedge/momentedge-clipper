# Builds the per-distro Debian packages for the clipper recorder and, on a version
# tag, attaches them to the GitHub release. Two packages per distro, each built the
# way the ROS2 ecosystem builds its kind:
#
#   ros-<distro>-momentedge-msgs   the ament_cmake interface package, built with
#                                  bloom (the official ROS deb generator) into
#                                  /opt/ros/<distro> — a first-class ROS package.
#   momentedge-clipper             the Rust/r2r recorder, built with cargo-deb
#                                  (bloom has no cargo build type); Depends on the
#                                  msgs package above, so the message typesupport
#                                  resolves through the standard distro setup.bash.
#
# Native aarch64 build, matching the deployment targets: each matrix leg runs on a
# GitHub-hosted arm64 runner (ubuntu-22.04-arm / ubuntu-24.04-arm), installs the
# matching ROS2 distro from apt (ros-tooling/setup-ros), and builds both packages
# natively against it. The binary links the host's own rcl/rmw, so it is
# ABI-compatible with the target's ROS graph — the same reason deployment is native
# rather than nix or cross.
#
# A version tag (v*) publishes: the `release` job writes the release for that tag
# with notes generated from the conventional-commit history (git-cliff, cliff.toml)
# and both distros' .deb files attached. workflow_dispatch only builds and uploads
# artifacts (publish is off by default) but still renders the notes into the job
# summary, so the packaging and the notes can be exercised — and run locally under
# `act` — without creating a release. See .claude/skills/ci/SKILL.md for the act
# recipe.
#
# Tag annotatedly (`git tag -a v0.2.0`): the annotation's first line becomes the
# release headline and the rest the overview paragraph above the generated
# changelog. A lightweight tag publishes the changelog with no overview.
#
# Publishing is one job, not a matrix step: a release has a single body, so exactly
# one writer may own it. The `deb` legs only upload artifacts; `release` collects
# them and writes the release once, after every leg has passed.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Attach the .deb files to a GitHub release for this ref'
        type: boolean
        default: false

# Creating a release and uploading assets needs write access to repo contents.
permissions:
  contents: write

jobs:
  deb:
    name: ${{ matrix.distro }} (ubuntu ${{ matrix.ubuntu }})
    runs-on: ${{ matrix.runner }}
    # Native arm64 compile of the crate against an apt ROS2; generous so a cold apt
    # + cargo build finishes without tripping the limit.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: humble
            ubuntu: '22.04'
            runner: ubuntu-22.04-arm
          - distro: jazzy
            ubuntu: '24.04'
            runner: ubuntu-24.04-arm
    env:
      ROS_DISTRO: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v6

      # The arm64 runner image fetches base Ubuntu packages from ports.ubuntu.com,
      # which is intermittently unroutable from the runner network — IPv6 has no
      # route (Network is unreachable) and IPv4 times out — so the setup-ros apt
      # install below dies with "Unable to fetch some archives". Repoint apt at the
      # Azure ports mirror the runners reach over the Azure backbone, and force IPv4
      # since the archive has no working IPv6 route. Only the ports.ubuntu.com host
      # is rewritten (the rewrite is idempotent and leaves packages.ros.org alone);
      # the apt.conf drop-in also adds retries the whole job inherits.
      - name: Repoint apt at the Azure ports mirror
        run: |
          set -euo pipefail
          files=$(grep -rl '//ports.ubuntu.com/' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null || true)
          if [ -n "$files" ]; then
            sudo sed -i 's|//ports.ubuntu.com/|//azure.ports.ubuntu.com/|g' $files
          fi
          printf 'Acquire::ForceIPv4 "true";\nAcquire::Retries "5";\nAcquire::http::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99momentedge-arm64-mirror >/dev/null
          sudo apt-get update

      # ros-tooling/setup-ros registers the packages.ros.org apt repository, installs
      # the ROS dev tools (colcon, build-essential, cmake, git) and rosdep, and
      # installs the matrix distro's desktop variant — ros-base, rosbag2 + the MCAP
      # storage plugin, rmw_fastrtps_cpp, and the ament_cmake / rosidl generators
      # that bloom builds momentedge_msgs against.
      - name: Set up ROS2
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.distro }}

      # bloom + debhelper build the msgs .deb; libclang is r2r's bindgen codegen dep
      # for the clipper build. Everything else comes from setup-ros above or is
      # declared as the packages' Depends.
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev python3-bloom fakeroot debhelper dpkg-dev

      # System Rust toolchain on stable, exactly as the dev shell / native build uses
      # (the crates carry no feature gates).
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Cache the cargo registry + this distro's target/. The r2r build links the
      # distro's rcl/rmw, so the key is per distro.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.distro }}

      # cargo-deb assembles the clipper .deb from [package.metadata.deb].
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      # bloom resolves the momentedge_msgs package.xml depend keys through rosdep;
      # refresh the cache (setup-ros initialises it).
      - name: Update rosdep
        run: rosdep update

      # On a tag, version BOTH packages from the tag (v0.0.3 -> 0.0.3); otherwise the
      # package scripts fall back to the workspace Cargo.toml version. The msgs script
      # overrides its package.xml version with this same VERSION, so the two debs share
      # one version and one artefact name shape (<pkg>_<VERSION>_ubuntu<YY.MM>-<distro>_<arch>.deb).
      - name: Resolve version from tag
        if: ${{ github.ref_type == 'tag' }}
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # 1. The ROS2 package: bloom-build momentedge_msgs into ros-<distro>-momentedge-msgs.
      - name: Package momentedge_msgs (bloom)
        run: ./scripts/package-msgs-deb.sh

      # 2. Build the clipper binary natively against the host ROS2 (colcon overlay for
      #    r2r codegen + cargo). No MOMENTEDGE_RPATH: the deployed binary resolves its
      #    libraries through the sourced /opt/ros/<distro>/setup.bash, the standard ROS
      #    way, rather than baked rpaths.
      - name: Build clipper
        run: ./scripts/build-on-target.sh
        env:
          BUILD_PACKAGES: clipper

      # clipper's inline unit suite — `--bins` excludes the live-ROS e2e tests
      # (tests/e2e.rs). `--release` reuses the build step's artifacts.
      - name: Unit tests
        run: ./scripts/ros-cargo.sh test --release -p clipper --bins

      # 3. The Debian package: cargo-deb wraps the binary, Depends on the msgs deb.
      - name: Package clipper (cargo-deb)
        run: ./scripts/package-clipper-deb.sh

      # Validate the packages install and the dependency chain resolves: apt pulls
      # the msgs deb as a dependency of the clipper deb (installed first so it is
      # available locally), then clipper starts against the apt-installed typesupport,
      # sourcing only the distro setup — no build overlay. A missing/unresolved
      # typesupport would crash it immediately instead of idling to the SIGINT.
      - name: Smoke-test the installed packages
        run: |
          sudo apt-get install -y ./dist/ros-${{ matrix.distro }}-momentedge-msgs_*.deb
          sudo apt-get install -y ./dist/momentedge-clipper_*.deb
          source /opt/ros/${{ matrix.distro }}/setup.bash
          /opt/momentedge-clipper/bin/clipper --help
          rec="$(mktemp -d)"
          # `|| code=$?` so timeout's exit (124 when it fires the SIGINT after the
          # full window — the healthy case) doesn't fail the step.
          code=0
          RUST_LOG=info MOMENTEDGE_RECORD_DIR="$rec" timeout -s INT 6 \
            /opt/momentedge-clipper/bin/clipper || code=$?
          echo "clipper live-run exit code: $code (124 = ran the full window, then SIGINT)"

      # The only handoff to the `release` job below. Skipped under act (its artifact
      # backend is absent): the act run's verification is the successful build plus
      # the smoke-test and the package scripts' dpkg-deb output in the log.
      - name: Upload build artifacts
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: momentedge-debs-${{ matrix.distro }}-${{ matrix.ubuntu }}
          path: dist/*.deb
          if-no-files-found: error

  # Writes the GitHub release: notes from the commit history, both distros' .deb
  # files attached. Runs after every `deb` leg has passed, so a release is never
  # published with one distro's packages missing.
  #
  # It runs on every trigger, not only publishing ones — an unpublished dispatch
  # still renders the notes into the job summary, which is how you preview what a
  # tag would say before cutting it.
  release:
    name: release
    needs: deb
    # Plain amd64: this job only renders Markdown and moves .deb files around — it
    # neither builds nor runs them, so the arm64 runners are not needed here.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 is required — git-cliff walks the commits between the previous
      # tag and this one, which a shallow checkout does not contain. It also brings
      # the tag objects, and with them the annotation the notes lead with.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # cliff.toml groups the conventional-commit subjects (feat/fix/docs/...) into
      # the release body; it carries the full rationale. On a tag, `--latest` renders
      # that tag's section; otherwise `--unreleased` previews the commits accumulated
      # since the last tag. The action is composite (downloads a prebuilt git-cliff),
      # so it runs under act too.
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: ${{ github.ref_type == 'tag' && '--latest' || '--unreleased' }}
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Show the notes in the job summary
        run: |
          {
            echo "## Release notes (${{ github.ref_type == 'tag' && github.ref_name || 'unreleased' }})"
            echo
            cat RELEASE_NOTES.md
          } >> "$GITHUB_STEP_SUMMARY"

      # merge-multiple flattens both legs' artifacts into one dist/, matching the
      # layout the packaging scripts produce — the distro is already in each
      # filename (<pkg>_<VERSION>_ubuntu<YY.MM>-<distro>_<arch>.deb), so the two
      # legs' files never collide.
      - name: Download the built .deb files
        if: ${{ (github.ref_type == 'tag' || inputs.publish) && !env.ACT }}
        uses: actions/download-artifact@v4
        with:
          pattern: momentedge-debs-*
          merge-multiple: true
          path: dist

      # Publish only for a real tag push, or a dispatch that opted in. Never under
      # act, so local runs never touch releases.
      - name: Publish the GitHub release
        if: ${{ (github.ref_type == 'tag' || inputs.publish) && !env.ACT }}
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*.deb
          fail_on_unmatched_files: true
