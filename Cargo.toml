[workspace]
# A virtual workspace doesn't infer the resolver from member editions, so set it
# explicitly; "3" is the edition-2024 resolver. Without this Cargo falls back to
# resolver "1" and warns.
resolver = "3"
members = [
    # The shared library: the MCAP format layer, the recording index, the cut
    # path, the neutral trigger contract, and segment publication. ROS-free by
    # default — the `ros` feature adds only the CDR trigger decoder.
    "crates/clip",
    # Live tailing over `clip`: recording discovery, the recording collection and
    # its lifecycle, coverage, retention, and the waits a cut from a growing file
    # needs. ROS-free like `clip`.
    "crates/tail",
    "crates/clipper",
    # Example trigger source — a workspace member so it inherits the shared
    # package metadata and dependency versions below, not a deployable crate.
    "examples/trigger-pub",
    # Minimal MCAP writer example — writes one MCAP file directly with the
    # `mcap` crate (no ROS/r2r), owning `publish_time` outright: JSON channels
    # carrying capture stamps, plus an in-recording trigger channel.
    "examples/custom-mcap-writer",
    # Minimal MCAP writer example — tailable chunked + zstd-compressed output
    # via the `mcap` crate's buffered chunk mode (`use_chunks(true)` +
    # `disable_seeking(true)`): the second compliant producer path.
    "examples/chunked-mcap-writer",
    # Copper (cu29) CuSinkTask producer example — appends a tailable MCAP
    # Recording clipper cuts clips from, ROS-free. Its copper deps (cu29 and the
    # cu-bincode fork) stay declared in the crate's own Cargo.toml by decision —
    # do NOT hoist them into [workspace.dependencies]; keeping them crate-local
    # keeps the cu29 tree scoped to this one member.
    "examples/cu-mcap-record",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "Apache-2.0"
# The project URL a clip's manifest carries under `producer.url`
# (`clip::manifest`), so a clip read far from here names where it came from.
# Members inherit it with `repository.workspace = true`.
repository = "https://github.com/Momentedge/momentedge-clipper"

# Shared dependency versions; members inherit with `<crate>.workspace = true` and
# keep their own role comment (and any crate-specific features) at the use site.
[workspace.dependencies]
# Pinned to the 0.9.6 git tag rather than the 0.9.5 crates.io release: 0.9.6
# adds `lyrical` to its supported-distro list and cfg-gates the
# `RMW_QOS_POLICY_LIVELINESS_MANUAL_BY_NODE` rmw variant that lyrical dropped, so
# the r2r crates build there. 0.9.6 is not yet on crates.io — swap back to a
# version string once it is (beads clipper-4rw). Rolling needs more than
# 0.9.6 (beads clipper-2xb).
r2r = { git = "https://github.com/sequenceplanner/r2r.git", tag = "0.9.6" }
futures = "0.3"
crossbeam-channel = "0.5"
signal-hook = "0.3"
# The MCAP format layer: record parsing for the scan and the cut, and the clip
# writer. One version across the workspace, matching the `mcap` CLI on the dev
# shell, so a recording and a clip are read and written by the same format code
# the CLI inspects them with. The crate's write defaults are not a contract —
# the cut path names the codec and `clip::cut::CLIP_CHUNK_SIZE` outright, so a
# clip's layout is this workspace's decision rather than whatever the crate
# ships with.
mcap = "0.25"
anyhow = "1"
# CLI + env parsing: `derive` for the `Config` parser, `env` so each arg falls
# back to a `MOMENTEDGE_*` environment variable, `string` so the runtime-built
# env names (one prefix applied to every arg) can be set on the args.
clap = { version = "4", features = ["derive", "env", "string"] }
log = "0.4"
pretty_env_logger = "0.5"
fastrand = "2"
# JSON payloads for the mcap-writer examples.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
