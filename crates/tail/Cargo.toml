[package]
name = "tail"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Follow a growing MCAP recording and cut clips out of it as the data lands"

[features]
default = []
# Publishes the parts of this crate that exist only to be driven from a test —
# `Watch`'s unconditional setter and reader, which nothing in the tail itself
# calls (coverage rises through `send_if_modified`). A dev-only opt-in: a
# consumer enables it under `[dev-dependencies]`, where the v2+ resolver keeps it
# out of a normal build, so a release binary compiles neither.
test-support = []

[dependencies]
# The format layer this crate follows a live file with: the recording index the
# scan fills, the window plan it serves, the neutral trigger contract, and the
# cut a window ends in. Default features — nothing here needs r2r, so a build of
# this crate needs no ROS installation either.
clip = { path = "../clip" }
# Error plumbing for discovery, the scan loop and the retention prune.
anyhow.workspace = true
# The trigger tap the scan lifts records down, and each stage job's reply
# channel on the way back.
crossbeam-channel.workspace = true
# Logging via the `log` facade; the binary picks the backend.
log.workspace = true

[dev-dependencies]
# The MCAP fixture writers the tests build recordings with — the same ones
# `clip`'s own tests use, so a fixture cannot drift from what the scan expects.
# A dev-only feature: the v2+ resolver keeps it out of the normal build above.
clip = { path = "../clip", features = ["test-support"] }
# The clip compression codec the handler tests drive the staging pool through.
mcap.workspace = true

[lints.rust]
# A public type a downstream crate holds in a struct or logs on an error path
# needs `Debug`, and the omission only shows up in the consumer's build.
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
# Every arm of a match over one of *our* enums is a decision; a catch-all hides
# the site a new variant has to be handled at. Matches over foreign enums —
# `mcap::records::Record` above all — keep a catch-all under `#[expect]`, since
# upstream may add variants this crate has no opinion about.
wildcard_enum_match_arm = "warn"

# Deliberately not enabled here, having been measured rather than assumed:
#   missing_docs — 57 of the 60 hits are struct fields on types whose own docs
#     already say what they carry (`SchemaDef { name, encoding, data }`), so the
#     lint buys restated field names, not contracts.
#   clippy::arithmetic_side_effects — 25 hits, all offset and length arithmetic
#     in the scan and the cut, every one already bounded by an explicit
#     `MAX_RECORD_LEN` or file-length check before it runs. Suppressing 25 sites
#     would bury the two that matter.
